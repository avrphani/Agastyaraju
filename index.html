<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Agastyaraju — Women's Fashion</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- NAVBAR -->
<nav>
  <a href="#" class="nav-logo">Agastya<span>raju</span></a>
  <div class="nav-tagline">Women's Fashion</div>
</nav>

<!-- GALLERY -->
<section class="gallery-section">
  <div class="gallery-header">
    <div class="section-tag">Our Collection</div>
    <h2 class="section-title">Latest Arrivals</h2>
    <p class="gallery-sub">Exclusively curated women's wear — browse our newest styles</p>
  </div>
  <div class="gallery-grid" id="gallery-grid">
    <div class="gallery-loading">Loading collection…</div>
  </div>
</section>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightbox-close">✕</button>
  <button class="lightbox-prev" id="lightbox-prev">‹</button>
  <img class="lightbox-img" id="lightbox-img" src="" alt="" />
  <button class="lightbox-next" id="lightbox-next">›</button>
</div>

<!-- FOOTER -->
<footer>
  <div class="footer-logo">Agastya<span>raju</span></div>
  <div class="footer-copy">© 2026 Agastyaraju — Women's Fashion. All rights reserved.</div>
</footer>

<script src="script.js"></script>
</body>
</html>
